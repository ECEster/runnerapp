<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin beheer — Runningnederland</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, sans-serif; background: #f5f5f5; color: #222; min-height: 100vh; }

    /* ─── Header ─── */
    .admin-header {
      background: #4f7cff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
    }
    .admin-header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .02em; }
    .admin-header span { font-size: .85rem; opacity: .85; }
    .btn-logout {
      background: rgba(255,255,255,.2);
      border: none;
      color: #fff;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: .85rem;
      font-family: inherit;
      font-weight: 600;
    }
    .btn-logout:hover { background: rgba(255,255,255,.32); }

    /* ─── Layout ─── */
    .panel { max-width: 820px; margin: 32px auto; padding: 0 16px 60px; }

    /* ─── Card ─── */
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 28px;
      margin-bottom: 28px;
    }
    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid #eee;
      color: #333;
    }

    /* ─── Form ─── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: .78rem; font-weight: 600; color: #555; margin-bottom: 4px; }
    input[type=text], input[type=date], input[type=url], input[type=number],
    select, textarea {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: .88rem;
      font-family: inherit;
      background: #fafafa;
      color: #222;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4f7cff; background: #fff; }
    textarea { resize: vertical; min-height: 80px; }

    .checkbox-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .checkbox-row input { width: auto; }
    .checkbox-row label { margin: 0; font-weight: 400; font-size: .88rem; }

    /* ─── Image upload ─── */
    .img-upload-area {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      color: #888;
      font-size: .82rem;
      transition: border-color .15s;
      position: relative;
    }
    .img-upload-area:hover { border-color: #4f7cff; }
    .img-upload-area input[type=file] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    #img-preview { max-width: 180px; max-height: 120px; border-radius: 8px; margin-top: 10px; display: none; }
    .img-err { color: #c0392b; font-size: .78rem; margin-top: 6px; display: none; }

    /* ─── Translate button ─── */
    .btn-translate {
      background: #e8f0fe;
      color: #4f7cff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 4px;
    }
    .btn-translate:hover { background: #d2e3fc; }
    .btn-translate:disabled { opacity: .6; cursor: default; }

    /* ─── Submit ─── */
    .btn-submit {
      background: #4f7cff;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #3a63e0; }
    .btn-submit:disabled { opacity: .6; cursor: default; }
    .submit-msg { font-size: .82rem; margin-top: 8px; display: none; }
    .submit-msg.ok  { color: #27ae60; }
    .submit-msg.err { color: #c0392b; }

    /* ─── Events table ─── */
    .events-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
    .events-table th {
      text-align: left; padding: 8px 10px;
      background: #f7f7f7; border-bottom: 2px solid #eee; font-size: .78rem; color: #555;
    }
    .events-table td { padding: 9px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    .events-table tr:hover td { background: #fafafa; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 20px;
      font-size: .72rem; font-weight: 600;
    }
    .badge-green { background: #d4edda; color: #1a7431; }
    .badge-gray  { background: #e9ecef; color: #666; }
    .btn-table {
      padding: 4px 11px; border-radius: 6px; border: none;
      font-size: .75rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-pub   { background: #d4edda; color: #1a7431; }
    .btn-unpub { background: #fff3cd; color: #856404; }
    .btn-del   { background: #f8d7da; color: #721c24; }
    .btn-pub:hover   { background: #c3e6cb; }
    .btn-unpub:hover { background: #ffeaa0; }
    .btn-del:hover   { background: #f5c6cb; }
    .no-events { text-align: center; color: #aaa; padding: 24px; font-size: .88rem; }
  </style>
</head>
<body>

<!-- Header -->
<div class="admin-header">
  <div>
    <h1>🏃 Runningnederland Admin</h1>
    <span id="admin-user-email"></span>
  </div>
  <button class="btn-logout" id="btn-logout">Uitloggen</button>
</div>

<div class="panel">

  <!-- Formulier: nieuw event toevoegen -->
  <div class="card">
    <h2>➕ Nieuw evenement toevoegen</h2>
    <form id="event-form" autocomplete="off">
      <div class="form-grid">

        <div class="full">
          <label for="f-name-nl">Naam evenement</label>
          <input type="text" id="f-name-nl" placeholder="bijv. Dam tot Damloop" required>
        </div>

        <div>
          <label for="f-date">Datum</label>
          <input type="date" id="f-date" required>
        </div>
        <div>
          <label for="f-type">Type</label>
          <select id="f-type">
            <option value="road">Weg</option>
            <option value="trail">Trail</option>
            <option value="track">Baan</option>
            <option value="cross">Veldloop</option>
            <option value="virtual">Virtueel</option>
          </select>
        </div>

        <div>
          <label for="f-city">Stad / Plaats</label>
          <input type="text" id="f-city" placeholder="bijv. Amsterdam">
        </div>
        <div>
          <label for="f-province">Provincie</label>
          <select id="f-province">
            <option value="">— kies provincie —</option>
            <option>Groningen</option><option>Friesland</option><option>Drenthe</option>
            <option>Overijssel</option><option>Flevoland</option><option>Gelderland</option>
            <option>Utrecht</option><option>Noord-Holland</option><option>Zuid-Holland</option>
            <option>Zeeland</option><option>Noord-Brabant</option><option>Limburg</option>
          </select>
        </div>

        <div>
          <label for="f-distances">Afstanden (komma-gescheiden)</label>
          <input type="text" id="f-distances" placeholder="bijv. 5, 10, 21.1, 42.2">
        </div>
        <div>
          <label for="f-price">Inschrijfgeld (€)</label>
          <input type="text" id="f-price" placeholder="bijv. 15 of gratis">
        </div>

        <div>
          <label for="f-organizer">Organisator</label>
          <input type="text" id="f-organizer" placeholder="bijv. Atletiekunie">
        </div>
        <div>
          <label for="f-reg-url">Inschrijflink (URL)</label>
          <input type="url" id="f-reg-url" placeholder="https://...">
        </div>

        <!-- Afbeelding -->
        <div class="full">
          <label>Afbeelding (JPG, PNG of WebP · max 2 MB)</label>
          <div class="img-upload-area">
            <div>📷 Klik of sleep een afbeelding hierheen</div>
            <input type="file" id="f-image" accept="image/jpeg,image/png,image/webp">
            <img id="img-preview" alt="voorvertoning">
          </div>
          <div class="img-err" id="img-err"></div>
        </div>

        <!-- Beschrijving NL -->
        <div class="full">
          <label for="f-desc-nl">Beschrijving</label>
          <textarea id="f-desc-nl" placeholder="Schrijf hier een beschrijving..."></textarea>
          <div style="font-size:.75rem;color:#888;margin-top:4px">🌐 Engelse vertaling wordt automatisch aangemaakt bij opslaan</div>
        </div>

        <!-- Checkboxes -->
        <div>
          <div class="checkbox-row">
            <input type="checkbox" id="f-kidsrun">
            <label for="f-kidsrun">Bevat kinderloop 👦</label>
          </div>
        </div>
        <div>
          <div class="checkbox-row">
            <input type="checkbox" id="f-published">
            <label for="f-published">Direct publiceren</label>
          </div>
        </div>

      </div><!-- /form-grid -->

      <button type="submit" class="btn-submit" id="btn-submit">Evenement opslaan</button>
      <div class="submit-msg" id="submit-msg"></div>
    </form>
  </div>

  <!-- Overzicht bestaande events -->
  <div class="card">
    <h2>📋 Alle evenementen</h2>
    <table class="events-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Naam</th>
          <th>Stad</th>
          <th>Status</th>
          <th>Acties</th>
        </tr>
      </thead>
      <tbody id="events-tbody">
        <tr><td colspan="5" class="no-events">Laden…</td></tr>
      </tbody>
    </table>
  </div>

</div><!-- /panel -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="db.js"></script>
<script>
// ─── Auth check ───────────────────────────────────────────────
(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) { location.href = 'admin.html'; return; }
  document.getElementById('admin-user-email').textContent = data.session.user.email;
})();

document.getElementById('btn-logout').addEventListener('click', async () => {
  await db.auth.signOut();
  location.href = 'admin.html';
});

// ─── Image preview ────────────────────────────────────────────
const fileInput = document.getElementById('f-image');
const imgPreview = document.getElementById('img-preview');
const imgErr = document.getElementById('img-err');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  imgErr.style.display = 'none';
  imgPreview.style.display = 'none';
  if (!file) return;
  const ALLOWED = ['image/jpeg', 'image/png', 'image/webp'];
  if (!ALLOWED.includes(file.type)) {
    imgErr.textContent = 'Alleen JPG, PNG of WebP bestanden zijn toegestaan.';
    imgErr.style.display = 'block';
    fileInput.value = '';
    return;
  }
  if (file.size > 2 * 1024 * 1024) {
    imgErr.textContent = 'De afbeelding is te groot. Maximum is 2 MB.';
    imgErr.style.display = 'block';
    fileInput.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = e => { imgPreview.src = e.target.result; imgPreview.style.display = 'block'; };
  reader.readAsDataURL(file);
});

// ─── Vertaalfunctie (intern) ──────────────────────────────────
async function translateToEnglish(nlText) {
  if (!nlText) return '';
  try {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(nlText)}&langpair=nl|en&de=ej.liest@gmail.com`;
    const resp = await fetch(url);
    if (!resp.ok) return '';
    const json = await resp.json();
    const translated = json.responseData?.translatedText;
    return (translated && String(json.responseStatus) === '200') ? translated : '';
  } catch {
    return '';
  }
}

// ─── Formulier opslaan ────────────────────────────────────────
document.getElementById('event-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  const msg = document.getElementById('submit-msg');
  btn.disabled = true;
  btn.textContent = '🌐 Vertalen…';
  msg.style.display = 'none';

  try {
    let imageUrl = '';
    const file = fileInput.files[0];
    if (file) imageUrl = await uploadImage(file);

    const namNl  = document.getElementById('f-name-nl').value.trim();
    const descNl = document.getElementById('f-desc-nl').value.trim();

    // Auto-vertaal naar Engels
    const [nameEn, descEn] = await Promise.all([
      translateToEnglish(namNl),
      translateToEnglish(descNl),
    ]);

    btn.textContent = 'Opslaan…';

    const event = {
      name_nl:          namNl,
      name_en:          nameEn,
      date:             document.getElementById('f-date').value,
      type:             document.getElementById('f-type').value,
      city:             document.getElementById('f-city').value.trim(),
      province:         document.getElementById('f-province').value,
      distances:        document.getElementById('f-distances').value.trim(),
      price:            document.getElementById('f-price').value.trim(),
      organizer:        document.getElementById('f-organizer').value.trim(),
      registration_url: document.getElementById('f-reg-url').value.trim(),
      description_nl:   descNl,
      description_en:   descEn,
      image:            imageUrl,
      kidsrun:          document.getElementById('f-kidsrun').checked,
      published:        document.getElementById('f-published').checked,
    };

    await addEvent(event);

    msg.textContent = '✅ Evenement opgeslagen!';
    msg.className = 'submit-msg ok';
    msg.style.display = 'block';
    e.target.reset();
    imgPreview.style.display = 'none';
    loadEventsTable();
  } catch (err) {
    msg.textContent = '❌ Fout: ' + err.message;
    msg.className = 'submit-msg err';
    msg.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = 'Evenement opslaan';
});

// ─── Events tabel ─────────────────────────────────────────────
async function loadEventsTable() {
  const tbody = document.getElementById('events-tbody');
  tbody.innerHTML = '<tr><td colspan="5" class="no-events">Laden…</td></tr>';
  try {
    const events = await loadAllEventsAdmin();
    if (!events.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="no-events">Geen evenementen gevonden.</td></tr>';
      return;
    }
    tbody.innerHTML = events.map(ev => `
      <tr>
        <td>${ev.date || '—'}</td>
        <td><strong>${ev.name_nl || '—'}</strong>${ev.name_en ? '<br><small style="color:#888">' + ev.name_en + '</small>' : ''}</td>
        <td>${ev.city || '—'}</td>
        <td>
          <span class="badge ${ev.published ? 'badge-green' : 'badge-gray'}">
            ${ev.published ? 'Gepubliceerd' : 'Concept'}
          </span>
        </td>
        <td style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn-table ${ev.published ? 'btn-unpub' : 'btn-pub'}"
            onclick="togglePublish('${ev.id}', ${ev.published})">
            ${ev.published ? 'Verbergen' : 'Publiceer'}
          </button>
          <button class="btn-table btn-del" onclick="confirmDelete('${ev.id}', '${(ev.name_nl || '').replace(/'/g, "\\'")}')">
            Verwijder
          </button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" class="no-events" style="color:#c0392b">Fout: ${err.message}</td></tr>`;
  }
}

async function togglePublish(id, currentlyPublished) {
  try {
    await updateEvent(id, { published: !currentlyPublished });
    loadEventsTable();
  } catch (err) {
    alert('Fout bij bijwerken: ' + err.message);
  }
}

async function confirmDelete(id, name) {
  if (!confirm(`Wil je "${name}" echt verwijderen? Dit kan niet ongedaan worden gemaakt.`)) return;
  try {
    await deleteEvent(id);
    loadEventsTable();
  } catch (err) {
    alert('Fout bij verwijderen: ' + err.message);
  }
}

// Laad tabel bij openen pagina
loadEventsTable();
</script>
</body>
</html>
