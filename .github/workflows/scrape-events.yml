name: Scrape hardloopevenementen

# Alleen handmatig te starten (geen schema) — jij klikt op "Run workflow" in de
# Actions-tab op GitHub, vanaf elke computer, wanneer jij wilt.
on:
  workflow_dispatch:
    inputs:
      live:
        description: "Echt naar Supabase schrijven? (uit = alleen dry-run, print maar schrijft niets)"
        type: boolean
        default: false
      regio:
        description: "Alleen nieuwe events in deze regio toevoegen"
        type: choice
        options: [alle, noord, oost, zuid, west]
        default: alle
      max:
        description: "Maximaal aantal nieuwe events (veiligheidsstop; standaard 50)"
        type: string
        default: "50"
      vanaf:
        description: "Vanaf datum (JJJJ-MM-DD; leeg = vandaag)"
        type: string
        default: ""
      tot:
        description: "Tot en met datum (JJJJ-MM-DD)"
        type: string
        default: "2027-12-31"

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGIO: ${{ github.event.inputs.regio }}
          MAX_NIEUW: ${{ github.event.inputs.max }}
          VANAF: ${{ github.event.inputs.vanaf }}
          TOT: ${{ github.event.inputs.tot }}
        run: |
          if [ "${{ github.event.inputs.live }}" = "true" ]; then
            node write-events.js --live --regio="$REGIO" --max="$MAX_NIEUW" --vanaf="$VANAF" --tot="$TOT"
            # Nieuwe evenementen meteen coördinaten geven (postcodefilter)
            node geocode-events.js --live
            # Organisator zoeken op de site van nieuwe evenementen (alleen bij een duidelijke naam)
            node find-organizers.js --live
            # Inschrijfgeld zoeken op de site van evenementen zonder prijs (als voorstel in het admin-paneel)
            node suggest-prices.js --live
          else
            node write-events.js --regio="$REGIO" --max="$MAX_NIEUW" --vanaf="$VANAF" --tot="$TOT"
          fi

      # Alleen bij een live run schrijft suggest-prices.js dit bestand (dry-run: geen mail)
      - name: Bepaal of er nieuwe prijsvoorstellen zijn
        id: report
        run: |
          if [ -s price-suggestions-report.txt ]; then
            echo "has_content=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_content=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mail de nieuwe prijsvoorstellen
        if: steps.report.outputs.has_content == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_SENDER_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: RunningNederland <${{ secrets.GMAIL_SENDER_ADDRESS }}>
          to: runningnederland@gmail.com
          subject: "Nieuwe prijsvoorstellen — RunningNederland"
          body: file://scraper/price-suggestions-report.txt
