<script>
function getBadgeClass(type) { return 'badge-' + type.toLowerCase().replace(/\s+/g, '-'); }
function getTypeName(type, lang) {
  var names = {
    nl: { 'marathon':'Marathon','trail':'Trail','bosloop':'Trail','cross':'Cross','gemengd parcours':'Gemengd parcours','wegevenement':'Wegevenement','parkloop':'Parkloop','funrun':'Fun Run','survivalrun':'Survival Run','swimrun':'SwimRun','urbanrun':'Urban Run','ultrarun':'Ultrarun','virtuele run':'Virtuele Run','estafette':'Estafette','coopertest':'Coopertest','baanevenement':'Baanevenement','studentenevenement':'Studentenevenement','sportief wandelen':'Sportief Wandelen','inclusieve runs':'Inclusieve Run','gecertificeerd parcours':'Gecert. Parcours' },
    en: { 'marathon':'Marathon','trail':'Trail','bosloop':'Trail','cross':'Cross Country','gemengd parcours':'Mixed Terrain','wegevenement':'Road','parkloop':'Park Run','funrun':'Fun Run','survivalrun':'Survival Run','swimrun':'SwimRun','urbanrun':'Urban Run','ultrarun':'Ultra Run','virtuele run':'Virtual Run','estafette':'Relay','coopertest':'Cooper Test','baanevenement':'Track Event','studentenevenement':'Student Event','sportief wandelen':'Sports Walking','inclusieve runs':'Inclusive Run','gecertificeerd parcours':'Certified Course' }
  };
  return (names[lang]||names.nl)[type]||type;
}

// Vinkje in een rondje voor de labels onder de foto (Atletiekunie, aangepast sporten)
var DETAIL_CHECK_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M8 12.5l2.7 2.7L16 9.6"/></svg>';

function renderEvent(ev, lang) {
  var name = lang==='en' ? ev.name_en : ev.name_nl;
  var desc = lang==='en' ? ev.description_en : ev.description_nl;
  var dateStr = formatEventDate(ev, lang);
  var badgeClass = getBadgeClass(ev.type);
  var typeName = getTypeName(ev.type, lang);
  var distList = formatDistances(ev.distances);
  var catList = (ev.categories || []).join(', ') || '—'; // evenementen uit de database hebben (nog) geen categorieën

  var rolstoelHtml = ev.rolstoel ?
    '<span class="detail-badge">'+DETAIL_CHECK_SVG+'<span>'+t('detail_rolstoel')+'</span></span>' : '';

  var atletiekHtml = ev.atletiekunie ?
    '<span class="detail-badge">'+DETAIL_CHECK_SVG+'<span data-i18n="atletiekunie_badge">'+t('atletiekunie_badge')+'</span></span>' : '';

  var ytHtml = '';
  if (ev.youtube_url) {
    var ytId = ev.youtube_url.split('v=')[1];
    if (ytId) {
      ytHtml = '<div class="detail-youtube">'+
        '<h3>'+t('youtube_title')+'</h3>'+
        '<iframe src="https://www.youtube.com/embed/'+ytId+'" allowfullscreen></iframe>'+
      '</div>';
    }
  }

  var shareUrl = encodeURIComponent(window.location.href);

  return '<div class="event-detail">'+
    renderBreadcrumbs(name)+
    '<div class="event-detail__hero">'+
      '<img src="'+getEventImage(ev)+'" alt="">'+
      '<div class="event-detail__hero-overlay">'+
        '<span class="detail-type-label">'+typeName+'</span>'+
        (ev.type2 ? '<span class="detail-type-label">'+getTypeName(ev.type2, lang)+'</span>' : '')+
        '<h1 class="event-detail__title">'+softHyphenate(name)+'</h1>'+
      '</div>'+
    '</div>'+
    '<div class="event-detail__content">'+
      // Labels en knoppen op één regel onder de foto
      '<div class="event-detail__intro">'+
        ((atletiekHtml || rolstoelHtml) ? '<div class="detail-badges">'+atletiekHtml+rolstoelHtml+'</div>' : '')+
        '<div class="event-detail__actions">'+
          '<button type="button" class="btn btn--ghost btn--sm bookmark-inline" data-fav-id="'+ev.id+'" aria-pressed="false" onclick="toggleBookmark(event, '+ev.id+')">'+
            BOOKMARK_SVG+'<span class="bookmark-btn__label">'+t('bookmark_save')+'</span>'+
          '</button>'+
          // Eén deelknop: op de telefoon het deelmenu (WhatsApp, Instagram, ...),
          // op de computer link kopiëren
          '<button type="button" class="btn btn--ghost btn--sm" onclick="shareEvent(this)">'+
            '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>'+
            '<span>'+t('share_title')+'</span>'+
          '</button>'+
          '<span class="share-status" role="status" aria-live="polite"></span>'+
        '</div>'+
      '</div>'+
      (desc ? '<p class="event-detail__desc">'+desc+'</p>' : '')+
      // Alle gegevens in één kaart, in twee kolommen (geen fotogalerij meer)
      '<section class="event-detail__sidebar" aria-label="'+t('detail_info_label')+'">'+
        '<div class="detail-info-grid">'+
        '<div class="detail-info-row"><div><div class="detail-info-label">'+t('date_label')+'</div><div class="detail-info-value">'+dateStr+'</div></div></div>'+
        '<div class="detail-info-row"><div><div class="detail-info-label">'+t('location_label')+'</div><div class="detail-info-value">'+titleCase(ev.city)+'</div></div></div>'+
        '<div class="detail-info-row"><div><div class="detail-info-label">'+t('province_label')+'</div><div class="detail-info-value">'+ev.province+'</div></div></div>'+
        '<div class="detail-info-row"><div><div class="detail-info-label">'+t('distances_label')+'</div><div class="detail-info-value">'+distList+'</div></div></div>'+
        '<div class="detail-info-row"><div><div class="detail-info-label">'+t('price_label')+'</div><div class="detail-info-value">'+(!ev.paid ? t('free') : (ev.price ? formatPrice(ev.price) : (t('price_unknown') + (ev.registration_url ? ' · <a href="'+ev.registration_url+'" target="_blank" rel="noopener noreferrer" style="color:var(--dark3);font-size:0.9rem;">'+t('see_website')+'</a>' : ''))))+'</div></div></div>'+
        (ev.kidsrun ? '<div class="detail-info-row"><div><div class="detail-info-label">'+t('detail_kids')+'</div><div class="detail-info-value">'+(kidsAgeLabel(ev) || t('kids_age_unknown'))+'</div></div></div>' : '')+
        registrationInfoHtml(ev, lang)+
        (catList !== '—' ? '<div class="detail-info-row"><div><div class="detail-info-label">'+t('categories_label')+'</div><div class="detail-info-value">'+catList+'</div></div></div>' : '')+ // leeg = weglaten
        (ev.organizer ? '<div class="detail-info-row"><div><div class="detail-info-label">'+t('organizer_label')+'</div><div class="detail-info-value">'+ev.organizer+'</div></div></div>' : '')+ // leeg = kopje weglaten
        '</div>'+
        (ev.registration_url ? '<a href="'+ev.registration_url+'" target="_blank" rel="noopener noreferrer" class="event-detail__register" data-i18n="register_btn">'+t('register_btn')+'</a>' : '')+
      '</section>'+
      ytHtml+
    '</div>'+
  '</div>';
}

// ── Kruimelpad: Home › Agenda › naam van het evenement ──────────────
// Blok "Inschrijven": uitverkocht/vol per onderdeel, deadline en of je op de
// dag zelf kunt inschrijven. Alleen wat bekend is; niets bekend = geen blok.
function registrationInfoHtml(ev, lang) {
  function fmt(iso) {
    return new Date(iso + 'T12:00:00').toLocaleDateString(lang === 'en' ? 'en-GB' : 'nl-NL', { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
  }
  // Elk punt een eigen regel in de zijkolom (zelfde opmaak als Datum, Locatie, ...)
  var items = [];
  function item(label, value, note) {
    items.push('<div class="detail-info-row"><div><div class="detail-info-label">' + label + '</div>' +
      '<div class="detail-info-value">' + value + (note ? '<span class="detail-info-note">' + note + '</span>' : '') + '</div></div></div>');
  }
  var checked = ev.availability_checked_at ? t('reg_checked').replace('{date}', fmt(ev.availability_checked_at)) : '';
  if (ev.sold_out) item(t('reg_lbl_avail'), t('reg_sold_out'), checked);
  else if (ev.sold_out_distances) item(t('reg_lbl_avail'), t('reg_full_parts') + ' ' + escapeHtml(ev.sold_out_distances), t('reg_other_open') + (checked ? '<br>' + checked : ''));
  if (ev.registration_deadline) {
    var today = new Date().toISOString().slice(0, 10);
    item(ev.registration_deadline < today ? t('reg_lbl_closed') : t('reg_lbl_deadline'), fmt(ev.registration_deadline));
  }
  if (ev.max_participants) item(t('reg_lbl_max'), ev.max_participants.toLocaleString('nl-NL'));
  if (ev.late_registration === true) item(t('reg_lbl_late'), t('yes'));
  if (ev.late_registration === false) item(t('reg_lbl_late'), t('no'));
  return items.join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function renderBreadcrumbs(eventName) {
  var items = '<li><a href="agenda.html">'+t('nav_agenda')+'</a></li>';
  if (eventName) items += '<li aria-current="page"><span title="'+escapeHtml(eventName)+'">'+escapeHtml(eventName)+'</span></li>';
  return '<nav class="breadcrumbs" aria-label="'+t('breadcrumb_label')+'"><ol>'+items+'</ol></nav>';
}

// Zelfde pad als gestructureerde gegevens (BreadcrumbList), zodat Google het in de zoekresultaten kan tonen
function setBreadcrumbJsonLd(eventName) {
  var base = window.location.origin + window.location.pathname.replace(/[^\/]*$/, '');
  var data = {
    '@context': 'https://schema.org',
    '@type': 'BreadcrumbList',
    itemListElement: [
      { '@type': 'ListItem', position: 1, name: 'Home', item: base },
      { '@type': 'ListItem', position: 2, name: t('nav_agenda'), item: base + 'agenda.html' },
      { '@type': 'ListItem', position: 3, name: eventName, item: window.location.href }
    ]
  };
  var el = document.getElementById('breadcrumb-ld');
  if (!el) {
    el = document.createElement('script');
    el.type = 'application/ld+json';
    el.id = 'breadcrumb-ld';
    document.head.appendChild(el);
  }
  el.textContent = JSON.stringify(data);
}

// Delen: deelmenu van de telefoon als dat er is, anders de link kopiëren
function shareEvent(btn) {
  var url = window.location.href;
  var title = document.title;
  var status = btn.parentNode.querySelector('.share-status');
  function say(msg) { if (status) { status.textContent = msg; setTimeout(function() { status.textContent = ''; }, 4000); } }
  if (navigator.share) {
    navigator.share({ title: title, url: url }).catch(function() { /* geannuleerd */ });
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function() { say(t('share_copied')); }, function() { say(url); });
  } else {
    say(url);
  }
}

function renderNotFound() {
  return '<div class="event-detail">'+renderBreadcrumbs(null)+
    '<div class="no-events-msg"><div class="no-events-msg__icon">🏃</div><h3>Evenement niet gevonden</h3><p>Dit evenement bestaat niet of is verwijderd.</p></div></div>';
}

function toggleLang() {
  var cur = getLang();
  setLang(cur==='nl'?'en':'nl');
  var lang = getLang();
  var btnM = document.getElementById('lang-toggle-mobile');
  if (btnM) btnM.textContent = I18N[lang].nav_language;
  init();
}
function toggleMobileNav() { document.getElementById('mobile-nav').classList.toggle('open'); }

async function init() {
  var lang = getLang();
  applyI18n(lang);
  var btn = document.getElementById('lang-toggle');
  if (btn) btn.textContent = I18N[lang].nav_language;
  var btnM = document.getElementById('lang-toggle-mobile');
  if (btnM) btnM.textContent = I18N[lang].nav_language;

  // Haal ook evenementen op die via het admin-paneel zijn toegevoegd
  await loadEventsFromDB().catch(function(){ return false; });

  var params = new URLSearchParams(window.location.search);
  var id = parseInt(params.get('id'));
  var ev = EVENTS.find(function(e){ return e.id === id; });
  var root = document.getElementById('event-detail-root');
  if (ev) {
    // Zelfde foto als op de kaart waar je op klikte (&foto=), anders vast per evenement
    var foto = parseInt(params.get('foto'), 10);
    ev._fotoVariant = foto >= 0 ? foto : 'id';
    root.innerHTML = renderEvent(ev, lang);
    document.title = (lang==='en' ? ev.name_en : ev.name_nl) + ' — RunningNederland.nl';
    setBreadcrumbJsonLd(lang==='en' ? ev.name_en : ev.name_nl);
    markBookmarks(); // stand van de bladwijzer (FAV_IDS komt uit data.js)
  } else {
    root.innerHTML = renderNotFound();
  }
}

init();
</script>
