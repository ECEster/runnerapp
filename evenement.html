<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
function getBadgeClass(type) { return 'badge-' + type.toLowerCase().replace(/\s+/g, '-'); }
function getTypeName(type, lang) {
  var names = {
    nl: { 'marathon':'Marathon','trail':'Trail','cross':'Cross','wegevenement':'Wegevenement','parkloop':'Parkloop','funrun':'Fun Run','survivalrun':'Survival Run','ultrarun':'Ultrarun','virtuele run':'Virtuele Run','estafette':'Estafette','coopertest':'Coopertest','studentenevenement':'Studentenevenement','sportief wandelen':'Sportief Wandelen','inclusieve runs':'Inclusieve Run','gecertificeerd parcours':'Gecert. Parcours' },
    en: { 'marathon':'Marathon','trail':'Trail','cross':'Cross Country','wegevenement':'Road Race','parkloop':'Park Run','funrun':'Fun Run','survivalrun':'Survival Run','ultrarun':'Ultra Run','virtuele run':'Virtual Run','estafette':'Relay','coopertest':'Cooper Test','studentenevenement':'Student Event','sportief wandelen':'Sports Walking','inclusieve runs':'Inclusive Run','gecertificeerd parcours':'Certified Course' }
  };
  return (names[lang]||names.nl)[type]||type;
}

// Static gallery placeholder images
var GALLERY_IMGS = [
  'https://images.unsplash.com/photo-1571008887538-b36bb32f4571?w=600&q=70',
  'https://images.unsplash.com/photo-1517649763962-0c623066013b?w=600&q=70',
  'https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=600&q=70'
];

function renderEvent(ev, lang) {
  var name = lang==='en' ? ev.name_en : ev.name_nl;
  var desc = lang==='en' ? ev.description_en : ev.description_nl;
  var dateStr = formatDate(ev.date, lang);
  var badgeClass = getBadgeClass(ev.type);
  var typeName = getTypeName(ev.type, lang);
  var distList = ev.distances.join(' · ');
  var catList = ev.categories.join(', ');
  var favKey = 'fav_'+ev.id;
  var isFav = localStorage.getItem(favKey) === '1';

  // Check favorites
  var favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
  var alreadyFav = favorites.indexOf(ev.id) !== -1;

  var atletiekHtml = ev.atletiekunie ?
    '<div class="atletiekunie-badge">🏅 <span data-i18n="atletiekunie_badge">'+t('atletiekunie_badge')+'</span></div>' : '';

  var ytHtml = '';
  if (ev.youtube_url) {
    var ytId = ev.youtube_url.split('v=')[1];
    if (ytId) {
      ytHtml = '<div class="detail-youtube">'+
        '<h3>'+t('youtube_title')+'</h3>'+
        '<iframe src="https://www.youtube.com/embed/'+ytId+'" allowfullscreen></iframe>'+
      '</div>';
    }
  }

  var shareUrl = encodeURIComponent(window.location.href);
  var shareTitle = encodeURIComponent(name);

  return '<div class="event-detail">'+
    '<a href="agenda.html" class="event-detail__back" data-i18n="back_to_agenda">'+t('back_to_agenda')+'</a>'+
    '<div class="event-detail__hero">'+
      '<img src="'+ev.image+'" alt="'+name+'">'+
      '<div class="event-detail__hero-overlay">'+
        '<span class="event-card__badge '+badgeClass+'" style="position:static;display:inline-block;margin-bottom:0.5rem;font-size:0.82rem;padding:4px 12px;">'+typeName+'</span>'+
        '<h1 class="event-detail__title">'+name+'</h1>'+
      '</div>'+
    '</div>'+
    '<div class="event-detail__content">'+
      '<div>'+
        '<p class="event-detail__desc">'+desc+'</p>'+
        atletiekHtml+
        '<div style="margin-top:1.5rem;display:flex;gap:0.75rem;flex-wrap:wrap">'+
          '<button class="btn btn--ghost btn--sm" onclick="toggleFavorite('+ev.id+')" id="fav-btn">'+
            (alreadyFav ? '❤️ Opgeslagen' : '🤍 Opslaan')+
          '</button>'+
          '<a href="https://wa.me/?text='+shareTitle+'%20'+shareUrl+'" target="_blank" class="btn btn--share btn--share-wa">'+
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.114.549 4.1 1.508 5.836L0 24l6.334-1.479A11.953 11.953 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.006-1.374l-.36-.213-3.728.871.936-3.619-.235-.372A9.818 9.818 0 1112 21.818z"/></svg>'+
            ' WhatsApp</a>'+
          '<a href="https://www.facebook.com/sharer/sharer.php?u='+shareUrl+'" target="_blank" class="btn btn--share btn--share-fb">'+
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.97h-1.513c-1.491 0-1.956.93-1.956 1.886v2.269h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>'+
            ' Facebook</a>'+
          '<button class="btn btn--share btn--share-ig" onclick="copyShareLink(\''+shareUrl+'\', this)">'+
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>'+
            ' Instagram</button>'+
          '<a href="https://twitter.com/intent/tweet?url='+shareUrl+'&text='+shareTitle+'" target="_blank" class="btn btn--share btn--share-x">𝕏 X</a>'+
          '<a href="mailto:?subject='+shareTitle+'&body='+shareUrl+'" class="btn btn--share btn--share-mail">'+
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'+
            ' Mail</a>'+
        '</div>'+
        '<div class="detail-gallery" style="margin-top:2rem;">'+
          '<h3>'+t('gallery_title')+'</h3>'+
          '<div class="detail-gallery__grid">'+
            GALLERY_IMGS.map(function(src){ return '<img src="'+src+'" alt="Evenement foto" loading="lazy">'; }).join('')+
          '</div>'+
        '</div>'+
        ytHtml+
      '</div>'+
      '<aside class="event-detail__sidebar">'+
        '<div class="detail-info-row"><span class="detail-info-icon">📅</span><div><div class="detail-info-label">'+t('date_label')+'</div><div class="detail-info-value">'+dateStr+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">📍</span><div><div class="detail-info-label">'+t('location_label')+'</div><div class="detail-info-value">'+ev.city+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">🗺️</span><div><div class="detail-info-label">'+t('province_label')+'</div><div class="detail-info-value">'+ev.province+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">🏃</span><div><div class="detail-info-label">'+t('distances_label')+'</div><div class="detail-info-value">'+distList+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">💶</span><div><div class="detail-info-label">'+t('price_label')+'</div><div class="detail-info-value">'+(ev.paid?ev.price:t('free'))+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">👥</span><div><div class="detail-info-label">'+t('capacity_label')+'</div><div class="detail-info-value">'+ev.capacity.toLocaleString()+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">🏷️</span><div><div class="detail-info-label">'+t('categories_label')+'</div><div class="detail-info-value">'+catList+'</div></div></div>'+
        '<div class="detail-info-row"><span class="detail-info-icon">🏢</span><div><div class="detail-info-label">'+t('organizer_label')+'</div><div class="detail-info-value">'+ev.organizer+'</div></div></div>'+
        '<a href="'+ev.registration_url+'" class="event-detail__register" data-i18n="register_btn">'+t('register_btn')+'</a>'+
      '</aside>'+
    '</div>'+
  '</div>';
}

function copyShareLink(url, btn) {
  navigator.clipboard.writeText(decodeURIComponent(url)).then(function() {
    var orig = btn.innerHTML;
    btn.textContent = '✓ Link gekopieerd!';
    setTimeout(function() { btn.innerHTML = orig; }, 2000);
  });
}

function toggleFavorite(id) {
  var favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
  var idx = favorites.indexOf(id);
  if (idx === -1) {
    favorites.push(id);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    var btn = document.getElementById('fav-btn');
    if (btn) btn.textContent = '❤️ Opgeslagen';
  } else {
    favorites.splice(idx, 1);
    localStorage.setItem('favorites', JSON.stringify(favorites));
    var btn = document.getElementById('fav-btn');
    if (btn) btn.textContent = '🤍 Opslaan';
  }
}

function renderNotFound() {
  return '<div class="event-detail"><a href="agenda.html" class="event-detail__back">← Terug naar agenda</a>'+
    '<div class="no-events-msg"><div class="no-events-msg__icon">🏃</div><h3>Evenement niet gevonden</h3><p>Dit evenement bestaat niet of is verwijderd.</p></div></div>';
}

function toggleLang() {
  var cur = getLang();
  setLang(cur==='nl'?'en':'nl');
  var lang = getLang();
  var btnM = document.getElementById('lang-toggle-mobile');
  if (btnM) btnM.textContent = I18N[lang].nav_language;
  init();
}
function toggleMobileNav() { document.getElementById('mobile-nav').classList.toggle('open'); }

function init() {
  var lang = getLang();
  applyI18n(lang);
  var btn = document.getElementById('lang-toggle');
  if (btn) btn.textContent = I18N[lang].nav_language;
  var btnM = document.getElementById('lang-toggle-mobile');
  if (btnM) btnM.textContent = I18N[lang].nav_language;

  var params = new URLSearchParams(window.location.search);
  var id = parseInt(params.get('id'));
  var ev = EVENTS.find(function(e){ return e.id === id; });
  var root = document.getElementById('event-detail-root');
  if (ev) {
    root.innerHTML = renderEvent(ev, lang);
    document.title = (lang==='en' ? ev.name_en : ev.name_nl) + ' — runningnederland.nl';
  } else {
    root.innerHTML = renderNotFound();
  }
}

init();
</script>
